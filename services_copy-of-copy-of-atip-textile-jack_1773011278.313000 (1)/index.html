    <style>
      :root {
        --color-background: #FAF9F6;
        --color-background-end: #F4F1EA;
        --color-title: #1C1712;
        --color-subtitle: #3D3028;
        --color-red-button: #7D5134;
        --color-black-button: #E6DAC8;
        --color-black-button-text: #1C1712;
      }

      .dark {
        --color-background: #FAF9F6;
        --color-background-end: #F4F1EA;
        --color-title: #1C1712;
        --color-subtitle: #3D3028;
        --color-red-button: #7D5134;
        --color-black-button: #E6DAC8;
        --color-black-button-text: #1C1712;
      }

      body {
        background-color: var(--color-background);
        background-image: linear-gradient(to bottom, var(--color-background), var(--color-background-end));
        background-attachment: fixed;
        color: var(--color-subtitle);
        font-family: 'Montserrat', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      ::selection {
        background: var(--color-red-button);
        color: white;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes page-enter {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .animate-page-enter {
        animation: page-enter 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }

      .stagger-1 { animation-delay: 0.15s; }
      .stagger-2 { animation-delay: 0.3s; }

      /* Scroll reveal */
      .scroll-reveal {
        opacity: 0;
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .scroll-reveal-up    { transform: translateY(50px); }
      .scroll-reveal-left  { transform: translateX(-50px); }
      .scroll-reveal-right { transform: translateX(50px); }
      .scroll-reveal-visible {
        opacity: 1 !important;
        transform: translate(0, 0) !important;
      }
      
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-title);
        opacity: 0.3;
        border-radius: 10px;
      }

      /* Hide scrollbar for horizontal carousels */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Landscape blocker on mobile */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--color-background);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: 'Montserrat', sans-serif;
        text-align: center;
        padding: 2rem;
      }
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #rotate-overlay { display: flex; }
      }
    </style>
